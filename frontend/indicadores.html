<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indicadores · SIGDEI</title>
    <link rel="stylesheet" href="assets/css/gestao.css">
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/indicadores.js" defer></script>
</head>
<body class="gestao">
<main>
    <header>
        <h1>Indicadores</h1>
        <p class="muted">Gerencie o catálogo, registre medições e acompanhe o histórico de alterações.</p>
        <a id="back" href="dashboard.html" hidden>Voltar ao painel</a>
    </header>
    <form id="catalog-filters" class="panel fields">
        <label>Setor<select id="filter-sector"><option value="">Todos</option></select></label>
        <label>Tipo de dado<select id="filter-type"><option value="">Todos</option><option value="quantidade">Quantidade</option><option value="tempo">Tempo</option><option value="porcentagem">Porcentagem</option></select></label>
        <div class="actions"><button type="submit">Filtrar</button><button type="button" class="secondary" id="new-indicator" hidden>Novo indicador</button></div>
    </form>
    <p id="catalog-status" class="status" role="status"></p>
    <section class="panel" aria-label="Catálogo de indicadores">
        <div class="scroll"><table>
            <thead><tr><th>Indicador</th><th>Setor</th><th>Tipo</th><th>Periodicidade</th><th>Situação</th><th>Ações</th></tr></thead>
            <tbody id="catalog"></tbody>
        </table></div>
    </section>

    <form id="definition" class="panel" hidden>
        <h2 id="definition-title">Novo indicador</h2>
        <fieldset>
            <legend>Identificação</legend>
            <div class="fields">
                <label>Nome<input name="nome" maxlength="255" required></label>
                <label>Setor responsável<select name="id_setor" required></select></label>
                <label>Situação<select name="situacao"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></label>
            </div>
            <label>Descrição<textarea name="descricao" required rows="2"></textarea></label>
        </fieldset>
        <fieldset>
            <legend>Medição e fonte</legend>
            <div class="fields">
                <label>Tipo<select name="tipo_dado" required><option value="quantidade">Quantidade</option><option value="tempo">Tempo</option><option value="porcentagem">Porcentagem</option></select></label>
                <label>Unidade<input name="unidade" maxlength="40" required placeholder="Ex. atendimentos, horas ou %"></label>
                <label>Periodicidade<select name="periodicidade"><option value="diaria">Diária</option><option value="mensal">Mensal</option><option value="trimestral">Trimestral</option><option value="anual">Anual</option></select></label>
                <label>Meta, se aplicável<input type="number" name="meta" min="0" step="0.01" max="99999999.99"></label>
                <label>Critério da meta<select name="criterio_meta"><option value="minima">Atingir pelo menos o valor</option><option value="maxima">Ficar no máximo no valor</option></select></label>
            </div>
            <label>Fonte dos dados<input name="fonte" maxlength="255" required></label>
        </fieldset>
        <p id="definition-status" class="status" role="status"></p>
        <div class="actions"><button type="submit">Salvar indicador</button><button type="button" class="secondary" id="cancel-definition">Cancelar</button></div>
    </form>

    <section id="detail" class="panel" hidden>
        <h2 id="detail-title"></h2>
        <p id="detail-description"></p>
        <p id="detail-source" class="muted"></p>
        <form id="measurement" class="measure" hidden>
            <fieldset>
                <legend id="measurement-title">Registrar medição</legend>
                <div class="fields">
                    <label>Período de referência<input name="periodo_referencia" type="date" required></label>
                    <label><span id="measurement-unit">Valor registrado</span><input name="valor" type="number" min="0" step="0.01" max="99999999.99" required></label>
                    <div class="actions"><button type="submit">Salvar medição</button><button type="button" class="secondary" id="cancel-measurement" hidden>Cancelar edição</button></div>
                </div>
                <p id="measurement-help" class="muted"></p>
                <p id="measurement-status" class="status" role="status"></p>
            </fieldset>
        </form>
        <h3>Medições registradas</h3>
        <p id="record-status" class="status" role="status"></p>
        <div class="scroll"><table>
            <thead><tr><th>Referência</th><th>Valor</th><th>Ações</th></tr></thead>
            <tbody id="records"></tbody>
        </table></div>
        <div class="actions"><button type="button" class="secondary" id="more-records" hidden>Carregar mais medições</button></div>
        <details id="history">
            <summary>Histórico de alterações</summary>
            <p id="history-status" class="status" role="status"></p>
            <div id="history-events"></div>
            <button type="button" class="secondary" id="more-history" hidden>Carregar mais alterações</button>
        </details>
    </section>
</main>
</body>
</html>
