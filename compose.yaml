services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigdei}
      POSTGRES_USER: ${POSTGRES_USER:-sigdei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env e configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOCUMENTOS: ${SIGDEI_DOCUMENTOS:-0}
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_NUM_PROXIES: "1"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - document_index:/var/lib/sigdei
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "${SIGDEI_BIND:-127.0.0.1}:${SIGDEI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://127.0.0.1/ && wget -Y off -q -O /dev/null http://127.0.0.1/health/"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
  document_index:
