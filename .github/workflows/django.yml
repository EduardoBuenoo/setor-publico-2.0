name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            db_host: ""
          - python: "3.12"
            db_host: localhost
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigdei
          POSTGRES_USER: sigdei
          POSTGRES_PASSWORD: ci-local
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sigdei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: sigdei
      POSTGRES_USER: sigdei
      POSTGRES_PASSWORD: ci-local
      POSTGRES_HOST: ${{ matrix.db_host }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-documentos.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
